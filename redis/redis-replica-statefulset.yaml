apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis-replica
  namespace: redis
spec:
  serviceName: redis-headless
  replicas: 2                  # scale replicas 
  selector:
    matchLabels:
      app: redis
      role: replica
  template:
    metadata:
      labels:
        app: redis
        role: replica
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          command: ["redis-server"]
          args:
            - "--replicaof"
            - "redis-primary-0.redis-headless.redis.svc.cluster.local"   # updated DNS
            - "6379"  # points to primary