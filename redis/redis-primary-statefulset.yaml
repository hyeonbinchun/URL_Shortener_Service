apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: redis-primary
  namespace: redis

spec:
  serviceName: redis-headless
  replicas: 1   # Primary Redis instance
  selector:
    matchLabels:
      app: redis
      role: primary
  template:
    metadata:
      labels:
        app: redis
        role: primary
    spec:
      containers:
        - name: redis
          image: redis:latest
          ports:
            - containerPort: 6379
          command: ["redis-server"]
          args: ["--appendonly", "yes"]  # Enable persistence