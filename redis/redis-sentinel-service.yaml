apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-headless
  namespace: redis
spec:
  clusterIP: None
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379

---
apiVersion: v1
kind: Service
metadata:
  name: redis-sentinel-service
  namespace: redis
spec:
  selector:
    app: redis-sentinel
  ports:
    - name: sentinel
      port: 26379
      targetPort: 26379
  type: ClusterIP