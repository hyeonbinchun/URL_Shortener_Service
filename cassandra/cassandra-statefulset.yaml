apiVersion: apps/v1
kind: StatefulSet

metadata:
  name: cassandra
  namespace: cassandra

spec:
  serviceName: cassandra      # Must match the headless service
  replicas: 3                 # 3 Cassandra pods
  selector:                   # This StatefulSet manages pods with label app=cassandra
    matchLabels:
      app: cassandra         
  template:
    metadata:
      labels:
        app: cassandra        # This label is how the Service finds these pods
    spec:
      containers:
        - name: cassandra
          image: cassandra:4.1
          ports:
            - containerPort: 9042
          env:
            - name: CASSANDRA_SEEDS         # The first pod acts as the seed (entry point)
              value: "cassandra-0.cassandra.cassandra.svc.cluster.local"
            - name: CASSANDRA_CLUSTER_NAME
              value: "MyCluster"
            - name: CASSANDRA_DC
              value: "datacenter1"
            - name: CASSANDRA_RACK
              value: "Rack1"
            - name: MAX_HEAP_SIZE
              value: "512M"
            - name: HEAP_NEWSIZE
              value: "100M"
          readinessProbe:     # Kubernetes won't send traffic until this passes
            tcpSocket:
              port: 9042
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          volumeMounts:
            - name: cassandra-data
              mountPath: /var/lib/cassandra   # Where Cassandra stores its data files in Kubernetes node’s filesystem.
  
  volumeClaimTemplates:               # Automatically creates one PVC per pod, each with its own storage
    - metadata:
        name: cassandra-data
      spec:
        accessModes: ["ReadWriteOnce"]  # Each pod gets its own volume that only it can write to
        resources:
          requests:
            storage: 2Gi