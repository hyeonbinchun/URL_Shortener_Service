apiVersion: v1
kind: Service
metadata:
  name: cassandra
  namespace: cassandra
spec:
  clusterIP: None        # This is what makes it "headless" — no load balancer IP
  selector:
    app: cassandra       # Targets any pod with the label app=cassandra
  ports:
    - port: 9042         # CQL port — how clients talk to Cassandra
      name: cql