apiVersion: apps/v1
kind: Deployment

metadata:
  name: spring-deployment

spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-app
  
  template:
    metadata:
      labels:
        app: backend-app
    spec:
      containers:
        - name: spring-container
          image: owenchun/spring-server:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: SPRING_CASSANDRA_CONTACT_POINTS
              value: "cassandra.cassandra.svc.cluster.local"
            - name: SPRING_CASSANDRA_PORT
              value: "9042"
            - name: SPRING_CASSANDRA_KEYSPACE_NAME
              value: "url_shortener"
            - name: SPRING_CASSANDRA_LOCAL_DATACENTER
              value: "datacenter1"
            - name: REDIS_SENTINEL_MASTER
              value: "mymaster"
            - name: REDIS_SENTINEL_NODES
              value: "redis-sentinel-0.redis-sentinel-headless.redis.svc.cluster.local:26379,redis-sentinel-1.redis-sentinel-headless.redis.svc.cluster.local:26379,redis-sentinel-2.redis-sentinel-headless.redis.svc.cluster.local:26379"
            - name: APP_WRITE_MODE
              value: "direct"
          # Exclude Redis auto-configuration
            - name: SPRING_AUTOCONFIGURE_EXCLUDE
              value: "org.springframework.boot.autoconfigure.data.redis.RedisAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisReactiveAutoConfiguration,org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration"
            # Make Redis health check non-fatal
            - name: MANAGEMENT_HEALTH_REDIS_ENABLED
              value: "false"
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 15
            failureThreshold: 4
