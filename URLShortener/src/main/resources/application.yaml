spring:
  application:
    name: url_shortener
  
  kafka:
    topic:
      url-write: url.write
    bootstrap-servers: 3.87.112.165:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  cassandra:
    contact-points: cassandra.cassandra.svc.cluster.local  # cross-namespace DNS
    port: 9042
    keyspace-name: url_shortener
    local-datacenter: datacenter1
    schema-action: NONE

app:
  redis:
    sentinel:
      master: ${REDIS_SENTINEL_MASTER:mymaster}
      nodes: ${REDIS_SENTINEL_NODES:redis-sentinel-0.redis-sentinel-headless.redis.svc.cluster.local:26379,redis-sentinel-1.redis-sentinel-headless.redis.svc.cluster.local:26379,redis-sentinel-2.redis-sentinel-headless.redis.svc.cluster.local:26379}

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: url-shortener
    export:
      prometheus:
        enabled: true