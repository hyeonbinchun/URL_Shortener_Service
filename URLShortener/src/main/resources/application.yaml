spring:
  application:
    name: url_shortener
  
  cassandra:
    contact-points: localhost
    port: 9042
    keyspace-name: url_shortener
    local-datacenter: datacenter1
    schema-action: NONE

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus,metrics,info
  endpoint:
    prometheus:
      enabled: true
  metrics:
    tags:
      application: url-shortener
    export:
      prometheus:
        enabled: true